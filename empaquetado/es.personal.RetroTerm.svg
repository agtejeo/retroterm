<?xml version="1.0" encoding="UTF-8"?>
<!-- Icono de RetroTerm: un monitor CRT con un prompt de fósforo verde.
     Copyright (C) 2026 Alfonso García Tejeo <agtejeo@ugr.es> - GPL-3.0-or-later -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="cristal" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#123a1c"/>
      <stop offset="70%" stop-color="#0a140c"/>
      <stop offset="100%" stop-color="#030604"/>
    </radialGradient>
    <linearGradient id="carcasa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9d4c3"/>
      <stop offset="100%" stop-color="#a9a391"/>
    </linearGradient>
    <pattern id="barrido" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.35"/>
    </pattern>
    <filter id="halo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Pie del monitor -->
  <path d="M46 104 L82 104 L90 118 L38 118 Z" fill="#9b9583"/>
  <rect x="32" y="116" width="64" height="6" rx="2" fill="#8a8473"/>

  <!-- Carcasa -->
  <rect x="8" y="10" width="112" height="96" rx="12" fill="url(#carcasa)"/>
  <rect x="8" y="10" width="112" height="96" rx="12" fill="none" stroke="#7d7869" stroke-width="2"/>

  <!-- Pantalla -->
  <rect x="18" y="20" width="92" height="70" rx="10" fill="url(#cristal)"/>
  <rect x="18" y="20" width="92" height="70" rx="10" fill="url(#barrido)"/>
  <rect x="18" y="20" width="92" height="70" rx="10" fill="none" stroke="#33ff66" stroke-opacity="0.35" stroke-width="1.2"/>

  <!-- Prompt ">_" -->
  <g filter="url(#halo)" fill="none" stroke="#33ff66" stroke-width="6" stroke-linecap="square">
    <path d="M32 40 L48 52 L32 64"/>
  </g>
  <rect x="56" y="60" width="22" height="7" fill="#33ff66" filter="url(#halo)"/>

  <!-- Piloto de encendido -->
  <circle cx="104" cy="98" r="2.6" fill="#33ff66"/>
</svg>
